{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="card" style="margin-top:1rem; max-width:560px;">
    <h1>Регистрация</h1>
    <p class="meta">Выберите роль: организатор, участник или ментор.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Зарегистрироваться</button>
    </form>
</section>
{% endblock %}
