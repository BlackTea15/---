<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HackHub{% endblock %}</title>
    <style>
        :root { --bg:#f5f7fb; --card:#fff; --accent:#3f51b5; --accent-soft:#e6e9ff; --text:#222; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:Arial,sans-serif; color:var(--text); background:var(--bg); }
        .container { max-width:980px; margin:0 auto; padding:1rem; }
        .nav { background:var(--card); border-bottom:1px solid #d8ddf2; }
        .nav-inner { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
        .nav a { color:#2f3b7a; text-decoration:none; font-weight:600; margin-left:0.9rem; }
        .brand { font-size:1.2rem; color:var(--accent); margin-left:0 !important; }
        .card { background:var(--card); border-radius:14px; padding:1.2rem; border:1px solid #d8ddf2; box-shadow:0 3px 8px rgba(30,33,53,.06); }
        .grid { display:grid; gap:1rem; }
        .btn { display:inline-block; padding:.5rem .85rem; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; border:0; cursor:pointer; }
        .btn-light { background:#e9edff; color:#2d3d99; }
        .badge { display:inline-block; background:var(--accent-soft); color:#2d3d99; border-radius:999px; padding:.2rem .7rem; font-size:.85rem; margin-right:.4rem; }
        .meta { color:#5a5f80; font-size:.95rem; }
        input, select { width:100%; padding:.55rem; border:1px solid #c9cfea; border-radius:10px; margin-top:.25rem; margin-bottom:.8rem; }
        .errorlist { color:#b30021; margin:.2rem 0 .5rem; }
    </style>
</head>
<body>
<header class="nav">
    <div class="container nav-inner">
        <a href="{% url 'hackathons:home' %}" class="brand">HackHub</a>
        <nav>
            <a href="{% url 'hackathons:hackathon-list' %}">Хакатоны</a>
            {% if user.is_authenticated %}
                <a href="{% url 'hackathons:dashboard' %}">Кабинет</a>
                <form method="post" action="{% url 'hackathons:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button class="btn btn-light" type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'hackathons:login' %}">Вход</a>
                <a href="{% url 'hackathons:signup' %}">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>
<main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
