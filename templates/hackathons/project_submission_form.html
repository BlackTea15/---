{% extends 'hackathons/base.html' %}

{% block title %}Подача проекта{% endblock %}

{% block content %}
<section class="card page card-narrow">
    <h1>Подача проекта на {{ hackathon.title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button class="btn" type="submit">Отправить проект</button>
            <a class="btn btn-light" href="{% url 'hackathons:hackathon-detail' hackathon.id %}">Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
