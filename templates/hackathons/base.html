<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HackHub{% endblock %}</title>
    <style>
        :root {
            --bg:#26292B;
            --surface:#2E3239;
            --surface-soft:#343944;
            --accent:#5F7ADB;
            --accent-soft:#A2B2EE;
            --text:#F3F5FF;
            --muted:#C7D0F4;
        }
        * { box-sizing: border-box; }
        body {
            margin:0;
            font-family:Inter,Arial,sans-serif;
            color:var(--text);
            background:radial-gradient(circle at top right,#343A4A 0%,var(--bg) 45%);
        }
        .container { max-width:1080px; margin:0 auto; padding:1rem; }
        .nav {
            background:rgba(46,50,57,.92);
            border-bottom:1px solid rgba(162,178,238,.2);
            backdrop-filter: blur(6px);
        }
        .nav-inner { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
        .nav nav { display:flex; align-items:center; flex-wrap:wrap; row-gap:.5rem; }
        .nav a { color:var(--muted); text-decoration:none; font-weight:600; margin-left:0.9rem; }
        .nav a:hover { color:var(--text); }
        .brand { font-size:1.25rem; color:var(--accent-soft) !important; margin-left:0 !important; letter-spacing:.2px; }
        .card {
            background:linear-gradient(180deg,var(--surface-soft),var(--surface));
            border-radius:16px;
            padding:1.2rem;
            border:1px solid rgba(162,178,238,.22);
            box-shadow:0 14px 30px rgba(0,0,0,.28);
        }
        .grid { display:grid; gap:1rem; }
        .page { margin-top:1rem; }
        .page-title { margin:0 0 1rem; }
        .content-stack > * + * { margin-top:1rem; }
        .card-narrow { max-width:680px; }
        .card-auth { max-width:560px; }
        .actions { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
        .split-layout { display:grid; grid-template-columns:minmax(0,1.8fr) minmax(280px,1fr); gap:1rem; align-items:start; }
        .sidebar-sticky { position:sticky; top:1rem; }
        .filter-form { display:grid; grid-template-columns:1fr auto auto; gap:.6rem; align-items:end; }
        .list-compact { line-height:1.8; padding-left:1.2rem; margin:0; }
        .inline-forms { display:flex; gap:.5rem; flex-wrap:wrap; }
        .inline-forms form { margin:0; }
        @media (max-width: 980px) {
            .split-layout { grid-template-columns:1fr; }
            .card-narrow,
            .card-auth { max-width:none; }
            .filter-form { grid-template-columns:1fr; }
        }
        .btn {
            display:inline-block;
            padding:.55rem .95rem;
            border-radius:12px;
            background:linear-gradient(135deg,var(--accent),#7390f0);
            color:#fff;
            text-decoration:none;
            border:0;
            cursor:pointer;
            font-weight:600;
        }
        .btn-light {
            background:transparent;
            color:var(--accent-soft);
            border:1px solid rgba(162,178,238,.35);
        }
        .badge {
            display:inline-block;
            background:rgba(95,122,219,.22);
            color:var(--accent-soft);
            border:1px solid rgba(162,178,238,.3);
            border-radius:999px;
            padding:.2rem .7rem;
            font-size:.85rem;
            margin-right:.4rem;
        }
        .meta { color:var(--muted); font-size:.95rem; }
        .messages { margin-top: 1rem; }
        .messages .card { margin-bottom: .5rem; }
        input, select, textarea {
            width:100%;
            padding:.6rem;
            border:1px solid rgba(162,178,238,.35);
            border-radius:12px;
            margin-top:.25rem;
            margin-bottom:.8rem;
            color:var(--text);
            background:#252a33;
        }
        .errorlist { color:#ff8f9b; margin:.2rem 0 .5rem; }
        form p { margin:0 0 .8rem; }
        form p label { display:block; margin-bottom:.25rem; }
        hr { border-color: rgba(162,178,238,.2); }
    </style>
</head>
<body>
<header class="nav">
    <div class="container nav-inner">
        <a href="{% url 'hackathons:home' %}" class="brand">HackHub</a>
        <nav>
            <a href="{% url 'hackathons:hackathon-list' %}">Хакатоны</a>
            {% if user.is_authenticated %}
                <a href="{% url 'hackathons:team-list' %}">Команды</a>
                <a href="{% url 'hackathons:dashboard' %}">Кабинет</a>
                <form method="post" action="{% url 'hackathons:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button class="btn btn-light" type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'hackathons:login' %}">Вход</a>
                <a href="{% url 'hackathons:signup' %}">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>
<main class="container">
    {% if messages %}
    <section class="messages">
        {% for message in messages %}
            <div class="card">{{ message }}</div>
        {% endfor %}
    </section>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
